<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock paper scissors game</title>
    <link rel="stylesheet" href="sissor.css">
</head>
<body>
    <div class="title">
        <h1>Rock Paper scissors</h1>
    </div>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="rock.png" >
        </div>
        <div class="choice" id="paper">
            <img src="paper.png" >
        </div>
        <div class="choice" id="scissors">
            <img src="scissors.png" >
        </div>
    </div> 
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>  
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>Comp</p>  
        </div>
    </div>

    <div class="msg-con">
        <p id="msgg">Play Your Move</p>
    </div>
    <script src="rock.js"></script>
</body>
</html>
